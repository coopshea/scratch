<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Problems</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">Open Problems <span class="sub">prototype</span></div>
  <div class="lenses" id="lenses"></div>
  <div class="tools">
    <span class="hint">shift-click to combine lenses · 1–5, 0, Esc</span>
    <label class="toggle"><input type="checkbox" id="hike"> Hike mode</label>
  </div>
</header>
<main>
  <section class="map" id="map">
    <svg id="svg" role="img" aria-label="Problem neighborhood map"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="panel" id="panel">
    <nav class="tabs">
      <button data-tab="node" class="on">Problem</button>
      <button data-tab="wander">Worth wandering</button>
      <button data-tab="essays">Essays</button>
    </nav>
    <div class="tab" id="tab-node"></div>
    <div class="tab hidden" id="tab-wander"></div>
    <div class="tab hidden" id="tab-essays"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
